name: probe-models
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖
        run: python3 -m pip install -q --no-input torch --index-url https://download.pytorch.org/whl/cpu && python3 -m pip install -q --no-input transformers pillow accelerate
      - run: python3 scripts/probe.py
