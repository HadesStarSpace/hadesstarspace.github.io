name: 网络探测
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "-- httpbin"; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" https://httpbin.org/post -X POST -d 'a=1'
          echo "-- openai-ish"; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" https://api.openai.com/v1/models
          echo "-- models catalog"; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          echo "-- models chat"; curl -s -o /tmp/c.txt -w "%{http_code} %{size_download}\n" https://models.github.ai/inference/chat/completions -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say ok"}],"max_tokens":5}'
          head -c 300 /tmp/c.txt; echo
