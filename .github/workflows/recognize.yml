name: 识别入库

on:
  push:
    paths:
      - 'inbox/**'

permissions:
  contents: write

concurrency:
  group: recognize
  cancel-in-progress: false

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装识别依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libgl1 libglib2.0-0
          python -m pip install -q --no-input opencv-python-headless numpy
      - name: 识别截图并写回 data.json
        run: python scripts/process_inbox.py
      - name: 提交结果
        id: commit
        run: |
          git config user.name "qsx-bot"
          git config user.email "qsx-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "自动识别入库 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
