name: AI 识别入库

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-recognize
  cancel-in-progress: false

jobs:
  recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖（视觉模型跑 CPU）
        run: |
          python3 -m pip install -q --no-input torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q --no-input transformers pillow numpy opencv-python-headless accelerate
      - name: 缓存模型权重（15G 上限，命中就不用重新下）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vlm-qwen25vl3b-v1
      - name: AI 识别截图并写出结果 inbox_out
        env:
          VLM_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: python3 scripts/ai_inbox.py
      - name: 提交结果（只提交数据）
        run: |
          git config user.name "qsx-ai"
          git config user.email "qsx-ai@users.noreply.github.com"
          git add data.json img inbox inbox_out
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "AI 识别入库 $(date -u '+%H:%M:%S UTC')"
            git push
          fi
