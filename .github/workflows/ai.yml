name: AI 识别入库

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-recognize
  cancel-in-progress: false

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-cvgraph-v1
      - name: 准备依赖（只装 opencv + numpy）
        run: |
          if [ ! -d deps/cv2 ]; then
            python3 -m pip install -q --target deps --no-input opencv-python-headless numpy
          fi
      - name: 图形识别（不跑 OCR、不调外部模型）
        run: PYTHONPATH=deps python3 scripts/recognize.py
      - name: 提交结果
        run: |
          git config user.name "qsx-ai"
          git config user.email "qsx-ai@users.noreply.github.com"
          git add data.json img inbox inbox_out
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "图形识别入库 $(date -u '+%H:%M:%S UTC')"
            git push
          fi
