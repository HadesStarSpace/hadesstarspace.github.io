name: AI 识别入库

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-recognize
  cancel-in-progress: false

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-rapidocr-v4
      - name: 准备识别依赖（命中缓存就跳过 pip）
        run: |
          if [ ! -d deps/rapidocr_onnxruntime ]; then
            python3 -m venv .venv || true
            python3 -m pip install -q --target deps --no-input rapidocr_onnxruntime==1.4.4 opencv-python-headless numpy
          fi
      - name: AI 识别截图并写出结果 inbox_out
        run: PYTHONPATH=deps python3 scripts/ai_inbox.py
      - name: 提交结果（只提交数据，跳过 deps）
        run: |
          git config user.name "qsx-ai"
          git config user.email "qsx-ai@users.noreply.github.com"
          git add data.json img inbox inbox_out
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "AI 识别入库 $(date -u '+%H:%M:%S UTC')"
            git push
          fi
