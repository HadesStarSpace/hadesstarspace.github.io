name: AI 识别入库

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: ai-recognize
  cancel-in-progress: false

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备依赖（OpenCV 只用来裁预览图）
        run: python3 -m pip install -q --no-input opencv-python-headless numpy
      - name: 视觉模型识别并写出结果 inbox_out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISION_MODEL: openai/gpt-4o
        run: python3 scripts/ai_inbox.py
      - name: 提交结果（只提交数据）
        run: |
          git config user.name "qsx-ai"
          git config user.email "qsx-ai@users.noreply.github.com"
          git add data.json img inbox inbox_out
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "AI 识别入库 $(date -u '+%H:%M:%S UTC')"
            git push
          fi
