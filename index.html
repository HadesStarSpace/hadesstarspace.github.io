<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>量子神器交换站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1>量子<span>神器</span>交换站</h1>
  <div class="sub">截图自动识别 · 集团成员共用 · 数据存在 GitHub</div>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><i>已登记神器</i></div>
    <div class="stat"><b id="sList">0</b><i>可交换</i></div>
    <div class="stat"><b id="sPlayers">0</b><i>成员</i></div>
  </div>
</header>

<div class="card" id="meCard">
  <div class="lenflex" style="margin:0">
    <div><div class="muted">当前身份</div><div id="meName" style="font-weight:600;font-size:15px">未登记</div></div>
    <button class="btn ghost mini" onclick="openMe()">切换/新建</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab on" data-v="upload">上传入库</div>
  <div class="tab" data-v="market">交换市场</div>
  <div class="tab" data-v="match">需求匹配</div>
  <div class="tab" data-v="inbox">意向箱</div>
  <div class="tab" data-v="mine">我的</div>
</div>

<!-- ========== 上传 ========== -->
<div class="view" id="v-upload">
  <div class="card">
    <h3>上传「文物容器」截图</h3>
    <div class="muted" style="margin-bottom:10px">在游戏里打开文物容器面板，整屏截图上传。云端自动识别类型、等级、加成、光暗，约 30–60 秒后出现在「我的」里，识别不准可手动改。</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="btn" id="pickBtn">选择截图</button>
    <span class="muted" id="upHint" style="margin-left:8px"></span>
  </div>
  <div class="card hidden" id="queueCard">
    <h3>识别进度</h3>
    <div id="queueBox" class="muted"></div>
  </div>
  <div class="card">
    <h3>识别记录</h3>
    <div id="notices"></div>
  </div>
</div>

<!-- ========== 市场 ========== -->
<div class="view hidden" id="v-market">
  <div class="card">
    <div class="row">
      <select id="fType" style="flex:1;min-width:110px"><option value="">全部类型</option></select>
      <select id="fModule" style="flex:1;min-width:110px"><option value="">全部模块</option></select>
      <select id="fSide" style="width:90px"><option value="">光/暗</option><option>光</option><option>暗</option></select>
    </div>
  </div>
  <div id="marketList"></div>
</div>

<!-- ========== 匹配 ========== -->
<div class="view hidden" id="v-match">
  <div class="card">
    <h3>谁有我想要的 <span class="muted">（按我的需求自动匹配）</span></h3>
    <div id="wantList"></div>
  </div>
  <div class="card">
    <h3>我能满足谁 <span class="muted">（我的可交换神器 · 别人的需求）</span></h3>
    <div id="offerList"></div>
  </div>
</div>

<!-- ========== 意向箱 ========== -->
<div class="view hidden" id="v-inbox">
  <div class="card"><h3>收到的意向</h3><div id="inList"></div></div>
  <div class="card"><h3>我发出的意向</h3><div id="outList"></div></div>
</div>

<!-- ========== 我的 ========== -->
<div class="view hidden" id="v-mine">
  <div class="card">
    <h3>发布需求</h3>
    <div class="grid3">
      <div><label class="f">类型</label><select id="nType"></select></div>
      <div><label class="f">模块</label><select id="nModule"></select></div>
      <div><label class="f">光/暗</label><select id="nSide"><option value="">不限</option><option>光</option><option>暗</option></select></div>
    </div>
    <div class="grid2" style="margin-top:2px">
      <div><label class="f">最低等级</label><input id="nLv" type="number" value="11" min="0" max="20"></div>
      <div><label class="f">最低加成 %</label><input id="nBonus" type="number" value="360" step="1"></div>
    </div>
    <label class="f">备注</label><input id="nNote" placeholder="例如：愿意用 2 件 358 换 1 件 360">
    <div style="margin-top:10px"><button class="btn" onclick="postNeed()">发布需求</button></div>
  </div>
  <div class="card"><h3>我的神器</h3><div id="mineList"></div></div>
  <div class="card"><h3>我的需求</h3><div id="myNeedList"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlgTrade">
  <h3 style="margin:0 0 10px;font-size:15px">发起交换意向</h3>
  <div id="dlgTarget" class="muted" style="margin-bottom:10px"></div>
  <label class="f">我拿什么换（可选）</label>
  <select id="dlgGive"><option value="">不指定</option></select>
  <label class="f">留言</label>
  <textarea id="dlgMsg" rows="2" placeholder="说句话，比如约什么时候交易"></textarea>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost mini" onclick="dlgTrade.close()">取消</button>
    <button class="btn" id="dlgSend">发送意向</button>
  </div>
</dialog>

<dialog id="dlgEdit">
  <h3 style="margin:0 0 10px;font-size:15px">修正这件神器</h3>
  <label class="f">类型</label><select id="eType"></select>
  <div class="grid2">
    <div><label class="f">等级</label><input id="eLevel" type="number"></div>
    <div><label class="f">加成 %</label><input id="eBonus" type="number"></div>
  </div>
  <div class="grid2">
    <div><label class="f">量子模块</label><select id="eModule"></select></div>
    <div><label class="f">光/暗</label><select id="eSide"><option value="">—</option><option>光</option><option>暗</option></select></div>
  </div>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost mini" onclick="dlgEdit.close()">取消</button>
    <button class="btn" id="eSave">保存</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
