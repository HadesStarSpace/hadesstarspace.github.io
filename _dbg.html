<!doctype html><meta charset="utf-8"><body style="background:#111;color:#ddd;font:13px monospace">
<div id="out"></div>
<script src="tess/tesseract.min.js"></script>
<script>document.write('<script src="recog.js?v=' + Date.now() + '"><\/script>')</script>
<script>
const q = new URLSearchParams(location.search);
const src = q.get('img') || 'debug_img.png';
const out = document.querySelector('#out');
window.run = async (tw, th) => {
  const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; });
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, cv.width, cv.height);
  const plates = REC._test.detectPlates(data);
  out.innerHTML = '';
  const rows = [];
  for (const p of plates) {
    const level = await REC._test.readLevel(cv, p);
    const bonus = await REC._test.readBonus(cv, p);
    const cls = REC._test.classify(cv, p);
    rows.push({ w: +p.w.toFixed(1), h: +p.h.toFixed(1), cx: +p.cx.toFixed(0), cy: +p.cy.toFixed(0), level, bonus, type: cls.key });
  }
  out.textContent = JSON.stringify(rows, null, 1);
  return rows;
};
</script>
</body>
